[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-governance-proxy"
version = "0.1.0"
description = "MCP server that sits between agents and real systems. Evaluates every tool call before execution. Holds risky ones for human review."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Andreas Altamirano" }
]
keywords = [
    "mcp", "ai", "agents", "governance", "authorization",
    "proxy", "agent-security", "claude", "tool-use"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.0",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
wave = ["wave-engine>=0.1.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "wave-engine>=0.1.0"]

[project.urls]
Homepage = "https://github.com/andreas-altamirano/mcp-governance-proxy"
Repository = "https://github.com/andreas-altamirano/mcp-governance-proxy"
Issues = "https://github.com/andreas-altamirano/mcp-governance-proxy/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_governance_proxy*"]
exclude = ["tests*", "examples*"]
